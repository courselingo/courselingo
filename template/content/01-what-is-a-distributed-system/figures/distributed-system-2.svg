<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312"
     role="img" aria-labelledby="fig-distributed-system-2-title fig-distributed-system-2-desc">
  <title id="fig-distributed-system-2-title">节点承载副本，共识让副本步调一致</title>
  <desc id="fig-distributed-system-2-desc">上排是三者分工：节点是数据的落脚点，副本把同一份数据存多份，共识让多份副本认定同一件事；下排是没有共识时的后果，两个副本各自接受写入，网络恢复后两份数据已经对不上。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="312" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">节点承载副本，共识让副本步调一致</text>

  <rect x="22" y="66" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="88" font-size="12" fill="#1e40af" text-anchor="middle">节点</text>
  <text x="132" y="106" font-size="12" fill="#1e40af" text-anchor="middle">数据的落脚点</text>

  <rect x="268" y="66" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="378" y="88" font-size="12" fill="#b45309" text-anchor="middle">副本</text>
  <text x="378" y="106" font-size="12" fill="#b45309" text-anchor="middle">同一份数据存多份</text>

  <rect x="514" y="66" width="220" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="624" y="88" font-size="12" fill="#6b21a8" text-anchor="middle">共识</text>
  <text x="624" y="106" font-size="12" fill="#6b21a8" text-anchor="middle">多份副本认定同一件事</text>

  <path d="M247,93 L257,93" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M493,93 L503,93" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="146" width="716" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="380" y="168" font-size="12" fill="#9d174d" text-anchor="middle">没有共识：两个副本各自接受写入</text>
  <text x="380" y="186" font-size="12" fill="#9d174d" text-anchor="middle">网络恢复时，两份数据已经对不上</text>

  <rect x="22" y="226" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="250" font-size="11" fill="#1e293b" text-anchor="middle">节点是载体，副本是数据，共识是让两者同步的机制</text>
  <text x="380" y="270" font-size="10" fill="#64748b" text-anchor="middle">缺了共识，副本越多反而越容易分叉</text>
</svg>
