<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160"
     role="img" aria-labelledby="write-path-title write-path-desc">
  <title id="write-path-title">三个副本中两个已确认</title>
  <desc id="write-path-desc">节点 A 与节点 B 收到写入并落盘，节点 C 宕机未响应；两个确认即构成 2/3 多数派，写入成功，节点 C 可稍后补齐。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- 画布：固定浅色，深色页面上同样可读 -->
  <rect x="0" y="0" width="640" height="160" fill="#ffffff"/>

  <text x="320" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">三个副本中两个已确认即构成多数派</text>

  <!-- 节点 A：已确认 -->
  <rect x="22" y="68" width="180" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="112" y="96" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">节点 A</text>
  <text x="112" y="118" font-size="12" fill="#b45309" text-anchor="middle">已确认</text>

  <!-- 节点 B：已确认 -->
  <rect x="230" y="68" width="180" height="68" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="96" font-size="15" font-weight="600" fill="#b45309" text-anchor="middle">节点 B</text>
  <text x="320" y="118" font-size="12" fill="#b45309" text-anchor="middle">已确认</text>

  <!-- 节点 C：无响应 -->
  <rect x="438" y="68" width="180" height="68" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="528" y="96" font-size="15" font-weight="600" fill="#64748b" text-anchor="middle">节点 C</text>
  <text x="528" y="118" font-size="12" fill="#64748b" text-anchor="middle">未响应 · 待补齐</text>
</svg>
