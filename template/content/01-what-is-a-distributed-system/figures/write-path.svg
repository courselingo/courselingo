<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280"
     role="img" aria-labelledby="figTitle figDesc">
  <title id="figTitle">写入路径示意图</title>
  <desc id="figDesc">客户端向三个副本节点发送写入请求，两个节点返回确认，构成多数派，写入成功。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <style>
      .lbl { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .box { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 8; }
      .box-ack { fill: #ffffff; stroke: #2563eb; stroke-width: 1.6; rx: 8; }
      .box-down { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.6; stroke-dasharray: 5 4; rx: 8; }
      .name { font-size: 15px; fill: #1f2937; font-weight: 600; }
      .sub { font-size: 12px; fill: #6b7280; }
      .edge { stroke: #6b7280; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .edge-ack { stroke: #2563eb; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .accent { fill: #f59e0b; }
      .title { font-size: 14px; fill: #1f2937; font-weight: 600; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="280" fill="#ffffff"/>

  <!-- 客户端 -->
  <rect class="box" x="30" y="105" width="130" height="66"/>
  <text class="lbl name" x="95" y="133" text-anchor="middle">客户端</text>
  <text class="lbl sub" x="95" y="153" text-anchor="middle">发起写入</text>

  <!-- 三个节点 -->
  <rect class="box-ack" x="330" y="30" width="160" height="62"/>
  <text class="lbl name" x="410" y="56" text-anchor="middle">节点 A</text>
  <text class="lbl sub" x="410" y="76" text-anchor="middle">已确认</text>

  <rect class="box-ack" x="330" y="108" width="160" height="62"/>
  <text class="lbl name" x="410" y="134" text-anchor="middle">节点 B</text>
  <text class="lbl sub" x="410" y="154" text-anchor="middle">已确认</text>

  <rect class="box-down" x="330" y="186" width="160" height="62"/>
  <text class="lbl name" x="410" y="212" text-anchor="middle" fill="#9ca3af">节点 C</text>
  <text class="lbl sub" x="410" y="232" text-anchor="middle">已宕机 · 无响应</text>

  <!-- 请求边 -->
  <path class="edge" d="M 162 128 C 240 128, 250 61, 326 61"/>
  <path class="edge" d="M 162 138 L 326 138"/>
  <path class="edge" d="M 162 148 C 240 148, 250 217, 326 217"/>

  <!-- 确认边 -->
  <path class="edge-ack" d="M 326 76 C 250 96, 240 150, 166 148"/>
  <path class="edge-ack" d="M 326 158 C 250 165, 240 160, 166 156"/>

  <!-- 多数派标注 -->
  <rect class="accent" x="540" y="60" width="4" height="112" rx="2"/>
  <text class="lbl title" x="558" y="103">2 / 3 已确认</text>
  <text class="lbl sub" x="558" y="125">构成多数派 → 写入成功</text>
  <text class="lbl sub" x="558" y="145">剩余 1 个节点可稍后补齐</text>
</svg>
