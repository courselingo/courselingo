<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312"
     role="img" aria-labelledby="fig-mapreduce-3-title fig-mapreduce-3-desc">
  <title id="fig-mapreduce-3-title">一次作业怎么推进：中间结果落在本地磁盘</title>
  <desc id="fig-mapreduce-3-desc">主节点向下派发五类任务：输入切成 M 个分片交给 map，map 产出的中间键值对按 key 分区后写本机磁盘，reduce 拉取自己那份分区汇总，结果写进分布式存储；中间结果只被读一次，所以留本地最省。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="312" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">一次作业怎么推进：中间结果落在本地磁盘</text>

  <rect x="22" y="66" width="716" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="380" y="88" font-size="12" fill="#6b21a8" text-anchor="middle">主节点：派发任务、记录进度、失败就重新派发</text>
  <text x="380" y="106" font-size="12" fill="#6b21a8" text-anchor="middle">它自己不搬数据，也不读中间结果</text>

  <rect x="22" y="146" width="122" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="83" y="168" font-size="12" fill="#1e40af" text-anchor="middle">输入文件</text>
  <text x="83" y="186" font-size="12" fill="#1e40af" text-anchor="middle">切成 M 个分片</text>

  <rect x="170" y="146" width="122" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="231" y="168" font-size="12" fill="#b45309" text-anchor="middle">map 任务</text>
  <text x="231" y="186" font-size="12" fill="#b45309" text-anchor="middle">产出键值对</text>

  <rect x="318" y="146" width="122" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="379" y="168" font-size="12" fill="#9d174d" text-anchor="middle">本地磁盘</text>
  <text x="379" y="186" font-size="12" fill="#9d174d" text-anchor="middle">中间结果只留本机</text>

  <rect x="466" y="146" width="122" height="54" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="527" y="168" font-size="12" fill="#6b21a8" text-anchor="middle">reduce 任务</text>
  <text x="527" y="186" font-size="12" fill="#6b21a8" text-anchor="middle">拉取自己的分区</text>

  <rect x="614" y="146" width="122" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="675" y="168" font-size="12" fill="#166534" text-anchor="middle">输出文件</text>
  <text x="675" y="186" font-size="12" fill="#166534" text-anchor="middle">写进分布式存储</text>

  <path d="M83,125 L83,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M231,125 L231,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M379,125 L379,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M527,125 L527,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M675,125 L675,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="226" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="250" font-size="11" fill="#1e293b" text-anchor="middle">第 2 步是枢纽：中间结果只被读一次，留在本地最省</text>
  <text x="380" y="270" font-size="10" fill="#64748b" text-anchor="middle">机器一死只需重跑它产出的 map，不回滚全局状态</text>
</svg>
