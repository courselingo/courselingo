<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302"
     role="img" aria-labelledby="fig-mapreduce-1-title fig-mapreduce-1-desc">
  <title id="fig-mapreduce-1-title">每个作业都自带一套分布式骨架</title>
  <desc id="fig-mapreduce-1-desc">搜索索引、日志分析、图计算三类作业各自重写同一套骨架：怎么切分输入、机器挂了怎么重试、中间结果怎么搬；这三件事本可以只写一遍，抽出来做成框架后业务只交两个函数。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="302" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">每个作业都自带一套分布式骨架</text>

  <rect x="22" y="66" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="132" y="88" font-size="12" fill="#1e40af" text-anchor="middle">搜索索引</text>
  <text x="132" y="106" font-size="12" fill="#1e40af" text-anchor="middle">自带一套骨架</text>

  <rect x="268" y="66" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="378" y="88" font-size="12" fill="#1e40af" text-anchor="middle">日志分析</text>
  <text x="378" y="106" font-size="12" fill="#1e40af" text-anchor="middle">自带一套骨架</text>

  <rect x="514" y="66" width="220" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="624" y="88" font-size="12" fill="#1e40af" text-anchor="middle">图计算</text>
  <text x="624" y="106" font-size="12" fill="#1e40af" text-anchor="middle">自带一套骨架</text>

  <rect x="22" y="146" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="132" y="168" font-size="12" fill="#b45309" text-anchor="middle">怎么切分输入</text>
  <text x="132" y="186" font-size="12" fill="#b45309" text-anchor="middle">谁来跑哪一片</text>

  <rect x="268" y="146" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="378" y="168" font-size="12" fill="#b45309" text-anchor="middle">机器挂了怎么办</text>
  <text x="378" y="186" font-size="12" fill="#b45309" text-anchor="middle">重试几次算够</text>

  <rect x="514" y="146" width="220" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="624" y="168" font-size="12" fill="#b45309" text-anchor="middle">中间结果去哪</text>
  <text x="624" y="186" font-size="12" fill="#b45309" text-anchor="middle">怎么搬才不浪费</text>

  <rect x="22" y="226" width="716" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="380" y="248" font-size="12" fill="#166534" text-anchor="middle">抽出来做成框架：分片、调度、容错、数据搬运</text>
  <text x="380" y="266" font-size="12" fill="#166534" text-anchor="middle">业务逻辑只剩两个函数</text>

  <path d="M132,125 L132,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M378,125 L378,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M624,125 L624,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M132,205 L132,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M378,205 L378,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M624,205 L624,215" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
</svg>
