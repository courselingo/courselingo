<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312"
     role="img" aria-labelledby="fig-mapreduce-4-title fig-mapreduce-4-desc">
  <title id="fig-mapreduce-4-title">长尾任务：作业被最慢的那台拖住</title>
  <desc id="fig-mapreduce-4-desc">绝大多数任务早就做完，少数任务特别慢，整个作业被它们拖住；论文的对策是备份执行，把没结束的任务在另一台机器上再跑一份，谁先完成用谁的结果，用重复计算换收尾时间的确定性。</desc>

  <defs>
    <style>
      text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="312" fill="#ffffff"/>

  <text x="380" y="34" font-size="16" font-weight="600" fill="#1f2937" text-anchor="middle">长尾任务：作业被最慢的那台拖住</text>

  <rect x="22" y="66" width="344" height="54" rx="6" fill="#d1fae5" stroke="#22c55e"/>
  <text x="194" y="88" font-size="12" fill="#166534" text-anchor="middle">绝大多数任务</text>
  <text x="194" y="106" font-size="12" fill="#166534" text-anchor="middle">早就做完，机器闲着</text>

  <rect x="394" y="66" width="344" height="54" rx="6" fill="#fce7f3" stroke="#ec4899"/>
  <text x="566" y="88" font-size="12" fill="#9d174d" text-anchor="middle">少数任务特别慢</text>
  <text x="566" y="106" font-size="12" fill="#9d174d" text-anchor="middle">论文称之为落后者</text>

  <path d="M371,93 L383,93" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="146" width="716" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="380" y="168" font-size="12" fill="#b45309" text-anchor="middle">论文的对策：为还没结束的任务再起一份备份执行</text>
  <text x="380" y="186" font-size="12" fill="#b45309" text-anchor="middle">谁先跑完就用谁的结果，慢的那份被丢弃</text>

  <path d="M194,125 L194,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>
  <path d="M566,125 L566,135" fill="none" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="22" y="226" width="716" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="380" y="250" font-size="11" fill="#1e293b" text-anchor="middle">用重复计算换收尾时间的确定性，输出仍然唯一</text>
  <text x="380" y="270" font-size="10" fill="#64748b" text-anchor="middle">代价是多占一份资源，但只在作业收尾时发生</text>
</svg>
